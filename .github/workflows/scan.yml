name: Monthly Image Scan

on:
  schedule:
    - cron: '0 8 1 * *'  # 1st of each month, 8am UTC
  workflow_dispatch: {}    # manual trigger

permissions:
  contents: read
  security-events: write  # upload sarif results

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Scan published image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: ghcr.io/dakaneye/claude-sandbox:latest
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
